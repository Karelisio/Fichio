name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read VERSION (single source of truth)
        id: version
        run: |
          VERSION_NAME="$(tr -d '[:space:]' < VERSION)"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION_NAME}"

      - name: Check whether tag already exists
        id: tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version_name }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version_name }} already exists -> verification build only."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version_name }} does not exist -> build + release."
          fi

      # Always run: this is the "verification build" when the tag already exists.
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Release path (only when the tag does not exist yet).
      - name: Decode keystore
        if: steps.tag.outputs.exists == 'false'
        env:
          FICHIO_KEYSTORE_BASE64: ${{ secrets.FICHIO_KEYSTORE_BASE64 }}
        run: |
          echo "$FICHIO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fichio.keystore"
          echo "Keystore written to $RUNNER_TEMP/fichio.keystore"

      - name: Build signed release APK
        if: steps.tag.outputs.exists == 'false'
        env:
          FICHIO_KEYSTORE_PATH: ${{ runner.temp }}/fichio.keystore
          FICHIO_KEYSTORE_PASSWORD: ${{ secrets.FICHIO_KEYSTORE_PASSWORD }}
          FICHIO_KEY_ALIAS: ${{ secrets.FICHIO_KEY_ALIAS }}
          FICHIO_KEY_PASSWORD: ${{ secrets.FICHIO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Extract changelog section
        if: steps.tag.outputs.exists == 'false'
        run: |
          python3 - "${{ steps.version.outputs.version_name }}" <<'PY'
          import re, sys
          v = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"## \[{re.escape(v)}\][^\n]*\n(.*?)(?=\n## |\Z)", text, re.S)
          body = m.group(1).strip() if m else "No changelog entry for this version."
          open("changelog-body.md", "w", encoding="utf-8").write(body)
          PY
          echo "--- changelog body ---"
          cat changelog-body.md

      - name: Publish GitHub Release (creates tag if missing)
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Fichio v${{ steps.version.outputs.version_name }}
          body_path: changelog-body.md
          files: app/build/outputs/apk/release/*.apk
