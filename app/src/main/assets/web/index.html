<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Fichio — Transfert</title>
<style>
:root{
  --primary:#3f5f90;--on-primary:#fff;--primary-container:#d6e3ff;--on-primary-container:#254777;
  --secondary-container:#d9e3f8;--on-secondary-container:#3e4759;
  --tertiary-container:#f9d8ff;--on-tertiary-container:#563e5d;
  --error:#ba1a1a;--error-container:#ffdad6;--on-error-container:#93000a;
  --surface:#f9f9ff;--on-surface:#191c20;--on-surface-variant:#44474e;
  --container-low:#f3f3fa;--container:#ededf4;--container-high:#e7e8ee;--container-highest:#e2e2e9;
  --outline:#74777f;--outline-variant:#c4c6cf;--scrim:rgba(0,0,0,.32);
  --shadow:0 1px 3px rgba(0,0,0,.12),0 4px 12px rgba(0,0,0,.08);
  --r:24px;--ease:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){:root{
  --primary:#a8c8ff;--on-primary:#07305f;--primary-container:#254777;--on-primary-container:#d6e3ff;
  --secondary-container:#3e4759;--on-secondary-container:#d9e3f8;
  --tertiary-container:#563e5d;--on-tertiary-container:#f9d8ff;
  --error:#ffb4ab;--error-container:#93000a;--on-error-container:#ffdad6;
  --surface:#111318;--on-surface:#e2e2e9;--on-surface-variant:#c4c6cf;
  --container-low:#191c20;--container:#1d2024;--container-high:#282a2f;--container-highest:#33353a;
  --outline:#8e9099;--outline-variant:#44474e;--scrim:rgba(0,0,0,.55);
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--surface);color:var(--on-surface);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Google Sans",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.hidden{display:none!important}
svg{width:24px;height:24px;fill:currentColor;flex:none}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;font-weight:600;
  background:var(--primary);color:var(--on-primary);transition:border-radius .35s var(--ease),transform .25s var(--ease),filter .2s}
.btn:hover{filter:brightness(1.08)}.btn:active{border-radius:14px;transform:scale(.96)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.text{background:transparent;color:var(--primary);padding:10px 14px}
.btn.text:hover{background:color-mix(in srgb,var(--primary) 10%,transparent)}
.icon-btn{border:0;background:transparent;width:44px;height:44px;border-radius:999px;display:grid;place-items:center;cursor:pointer;color:var(--on-surface-variant);transition:background .2s,border-radius .3s var(--ease)}
.icon-btn:hover{background:var(--container-high)}.icon-btn:active{border-radius:12px}
.icon-btn.on{background:var(--secondary-container);color:var(--on-secondary-container)}
/* ---------- login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:24px}
.login-card{background:var(--container-low);border-radius:32px;padding:40px 32px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow);animation:pop .6s var(--ease)}
.blob{width:96px;height:96px;margin:0 auto 20px;background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;
  border-radius:42% 58% 55% 45%/48% 42% 58% 52%;animation:morph 9s ease-in-out infinite}
.blob svg{width:44px;height:44px}
@keyframes morph{0%,100%{border-radius:42% 58% 55% 45%/48% 42% 58% 52%;transform:rotate(0)}50%{border-radius:58% 42% 45% 55%/40% 60% 40% 60%;transform:rotate(180deg)}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(16px)}to{opacity:1;transform:none}}
h1{font-size:28px;margin:0 0 8px;letter-spacing:-.02em}
.muted{color:var(--on-surface-variant)}
.code{display:flex;gap:8px;justify-content:center;margin:28px 0 12px}
.code input{width:46px;height:58px;border-radius:16px;border:2px solid var(--outline-variant);background:var(--surface);text-align:center;font-size:26px;font-weight:700;outline:none;transition:border-color .2s,transform .3s var(--ease)}
.code input:focus{border-color:var(--primary);transform:translateY(-3px)}
.code.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.err{color:var(--error);min-height:22px;font-weight:500}
/* ---------- app ---------- */
header{position:sticky;top:0;z-index:5;background:var(--surface);padding:12px 20px 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand .logo{width:40px;height:40px;border-radius:14px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.brand b{font-size:20px;letter-spacing:-.01em}.brand small{display:block;color:var(--on-surface-variant);font-size:13px}
.search{display:flex;align-items:center;gap:8px;background:var(--container-high);border-radius:999px;padding:0 16px;height:48px;min-width:240px;flex:0 1 380px;transition:box-shadow .2s}
.search:focus-within{box-shadow:0 0 0 2px var(--primary)}
.search input{border:0;background:transparent;outline:none;flex:1;height:100%}
.toolbar{display:flex;align-items:center;gap:4px;padding:0 16px 8px 20px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-right:auto}
.chip{border:1px solid var(--outline-variant);background:transparent;border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:500;transition:background .2s,border-radius .3s var(--ease)}
.chip:hover{background:var(--container-high)}.chip.cur{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent;border-radius:999px}
.sep{color:var(--outline)}
main{padding:0 16px 120px}
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:20px;cursor:pointer;transition:background .15s,transform .3s var(--ease);animation:rise .45s var(--ease) both}
.row:hover{background:var(--container)}.row:active{transform:scale(.985)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ico{width:44px;height:44px;display:grid;place-items:center;flex:none;overflow:hidden;border-radius:14px}
.ico.dir{border-radius:42% 58% 50% 50%/50% 45% 55% 50%}
.ico img{width:100%;height:100%;object-fit:cover}
.name{flex:1;min-width:0}.name b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name small{color:var(--on-surface-variant)}
.row .dl{opacity:0;transition:opacity .2s}.row:hover .dl{opacity:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid .row{flex-direction:column;align-items:stretch;text-align:center;padding:12px;background:var(--container-low)}
.grid .ico{width:100%;height:110px;border-radius:18px}.grid .ico svg{width:44px;height:44px}
.grid .row .dl{display:none}
.empty{text-align:center;padding:80px 20px;color:var(--on-surface-variant)}
/* ---------- fab + drop ---------- */
.fab{position:fixed;right:24px;bottom:24px;z-index:6;display:flex;align-items:center;gap:12px;border:0;cursor:pointer;height:64px;padding:0 24px;border-radius:20px;
  background:var(--primary-container);color:var(--on-primary-container);font-weight:600;box-shadow:var(--shadow);transition:border-radius .35s var(--ease),transform .3s var(--ease)}
.fab:hover{border-radius:28px;transform:translateY(-2px)}.fab:active{transform:scale(.95)}
#drop{position:fixed;inset:0;z-index:20;background:var(--scrim);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .2s}
#drop.on{opacity:1}
#drop .zone{width:min(560px,86vw);height:min(360px,60vh);border-radius:48px;border:3px dashed var(--primary);background:var(--primary-container);color:var(--on-primary-container);
  display:grid;place-items:center;text-align:center;transform:scale(.85);transition:transform .45s var(--ease)}
#drop.on .zone{transform:scale(1)}
#drop svg{width:72px;height:72px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
/* ---------- uploads panel ---------- */
#uploads{position:fixed;left:24px;bottom:24px;z-index:7;width:min(380px,calc(100vw - 48px));background:var(--container-high);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;max-height:50vh;overflow:auto;animation:pop .4s var(--ease)}
.up{padding:8px 0}.up b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:99px;background:var(--container-highest);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--primary);border-radius:99px;transition:width .2s}
.up.done .bar i{background:#2e7d32}.up.fail .bar i{background:var(--error)}
/* ---------- dialog / toast ---------- */
dialog{border:0;border-radius:28px;padding:24px;background:var(--container-high);color:var(--on-surface);width:min(360px,90vw)}
dialog::backdrop{background:var(--scrim)}
dialog input{width:100%;height:52px;border-radius:12px;border:1px solid var(--outline);background:transparent;padding:0 14px;margin:16px 0;outline:none}
dialog input:focus{border:2px solid var(--primary)}
.actions{display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(40px);opacity:0;background:var(--on-surface);color:var(--surface);padding:12px 20px;border-radius:12px;transition:all .35s var(--ease);z-index:30}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:640px){.search{flex:1 1 100%;order:3}.fab span{display:none}.fab{padding:0 20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="login" class="hidden">
  <div class="login-card">
    <div class="blob"><svg><use href="#i-lock"/></svg></div>
    <h1>Fichio</h1>
    <div class="muted">Saisissez le code à 6 chiffres affiché sur le téléphone, dans <b>Transfert local</b>.</div>
    <form id="codeForm" autocomplete="off">
      <div class="code" id="code"></div>
      <div class="err" id="loginErr"></div>
      <button class="btn" type="submit">Se connecter</button>
    </form>
  </div>
</section>

<section id="app" class="hidden">
  <header>
    <div class="brand"><div class="logo"><svg><use href="#i-phone"/></svg></div><div><b id="device">Fichio</b><small id="space"></small></div></div>
    <label class="search"><svg><use href="#i-search"/></svg><input id="q" placeholder="Rechercher dans ce dossier" type="search"></label>
  </header>
  <div class="toolbar">
    <nav class="crumbs" id="crumbs"></nav>
    <button class="icon-btn" id="hiddenBtn" title="Fichiers masqués"><svg><use href="#i-eye"/></svg></button>
    <button class="icon-btn" id="viewBtn" title="Grille / liste"><svg><use href="#i-grid"/></svg></button>
    <button class="icon-btn" id="zipBtn" title="Télécharger le dossier (zip)"><svg><use href="#i-download"/></svg></button>
    <button class="btn tonal" id="mkdirBtn"><svg><use href="#i-newfolder"/></svg>Nouveau dossier</button>
  </div>
  <main><div id="files" class="list"></div></main>
  <button class="fab" id="fab"><svg><use href="#i-upload"/></svg><span>Envoyer des fichiers</span></button>
  <input type="file" id="picker" multiple hidden>
</section>

<div id="drop"><div class="zone"><div><svg><use href="#i-upload"/></svg><h1>Déposez pour envoyer</h1><div id="dropDest"></div></div></div></div>
<div id="uploads" class="hidden"></div>
<div id="toast"></div>
<dialog id="mkdirDlg"><form method="dialog" id="mkdirForm">
  <h2 style="margin:0">Nouveau dossier</h2>
  <input id="mkdirName" placeholder="Nom du dossier" required maxlength="200">
  <div class="actions"><button class="btn text" value="cancel" type="button" id="mkdirCancel">Annuler</button><button class="btn" value="ok">Créer</button></div>
</form></dialog>

<script>
"use strict";
const $ = s => document.querySelector(s);
const state = { path: "/", entries: [], grid: localStorage.getItem("grid") === "1", hidden: false, info: null };
const ICONS = { FOLDER:["i-folder","--primary-container","--on-primary-container"], IMAGE:["i-image",150], VIDEO:["i-video",-40], AUDIO:["i-audio",60],
  PDF:["i-doc",175], DOCUMENT:["i-doc",0], SPREADSHEET:["i-doc",110], PRESENTATION:["i-doc",-150], TEXT:["i-doc",20], CODE:["i-code",-80],
  ARCHIVE:["i-archive",-110], APK:["i-apk",90], EBOOK:["i-doc",200], FONT:["i-file",240], OTHER:["i-file",null] };
const THUMB = new Set(["IMAGE","VIDEO","AUDIO"]);

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function icon(id) { const s = document.createElementNS("http://www.w3.org/2000/svg","svg"); const u = document.createElementNS("http://www.w3.org/2000/svg","use"); u.setAttribute("href","#"+id); s.appendChild(u); return s; }
function size(b) { if (b < 1024) return b + " o"; const u = ["Ko","Mo","Go","To"]; let i = -1; do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1); return b.toLocaleString("fr-FR",{maximumFractionDigits: b >= 100 ? 0 : b >= 10 ? 1 : 2}) + " " + u[i]; }
function date(ms) { return new Date(ms).toLocaleString("fr-FR",{dateStyle:"medium",timeStyle:"short"}); }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2800); }
function q(path) { return encodeURIComponent(path); }

async function api(url, opts) {
  const r = await fetch(url, Object.assign({ credentials: "same-origin" }, opts));
  if (r.status === 401) { showLogin(); throw new Error("auth"); }
  return r;
}

/* ---------- login ---------- */
const ERRORS = { invalid: "Code incorrect.", locked: "Trop d'essais : un nouveau code a été généré sur le téléphone. Patientez 30 s.", nocode: "Ce code a déjà été utilisé ou a expiré. Générez-en un nouveau sur le téléphone.", auth: "" };
function buildCode() {
  const box = $("#code"); box.textContent = "";
  for (let i = 0; i < 6; i++) {
    const inp = el("input"); inp.inputMode = "numeric"; inp.maxLength = 1; inp.setAttribute("aria-label", "Chiffre " + (i + 1));
    inp.addEventListener("input", () => { inp.value = inp.value.replace(/\D/g, ""); if (inp.value && inp.nextSibling) inp.nextSibling.focus(); if (codeValue().length === 6) submitCode(); });
    inp.addEventListener("keydown", e => { if (e.key === "Backspace" && !inp.value && inp.previousSibling) inp.previousSibling.focus(); });
    inp.addEventListener("paste", e => { const d = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6); if (d) { e.preventDefault(); [...box.children].forEach((c, k) => c.value = d[k] || ""); if (d.length === 6) submitCode(); } });
    box.appendChild(inp);
  }
}
function codeValue() { return [...$("#code").children].map(i => i.value).join(""); }
function showLogin(err) {
  $("#app").classList.add("hidden"); $("#login").classList.remove("hidden");
  buildCode(); $("#loginErr").textContent = ERRORS[err] || ""; setTimeout(() => $("#code").firstChild.focus(), 50);
}
async function submitCode() {
  const r = await fetch("/api/auth", { method: "POST", headers: {"Content-Type":"application/x-www-form-urlencoded"}, body: "code=" + codeValue(), credentials: "same-origin" });
  const j = await r.json().catch(() => ({}));
  if (j.ok) { start(); return; }
  const c = $("#code"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
  $("#loginErr").textContent = (ERRORS[j.error] || "Connexion refusée.") + (j.attemptsLeft ? " Encore " + j.attemptsLeft + " essai(s)." : "");
  [...c.children].forEach(i => i.value = ""); c.firstChild.focus();
}
$("#codeForm").addEventListener("submit", e => { e.preventDefault(); if (codeValue().length === 6) submitCode(); });

/* ---------- browsing ---------- */
async function start() {
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  history.replaceState(null, "", "/" + location.hash);
  try { const r = await api("/api/info"); state.info = await r.json(); $("#device").textContent = state.info.device; $("#space").textContent = size(state.info.free) + " libres sur " + size(state.info.total); } catch (e) {}
  openDir(decodeURIComponent(location.hash.slice(1)) || "/");
}
async function openDir(path) {
  try {
    const r = await api("/api/list?path=" + q(path));
    if (!r.ok) { toast("Dossier inaccessible"); if (path !== "/") openDir("/"); return; }
    const j = await r.json(); state.path = j.path; state.entries = j.entries;
    if (location.hash.slice(1) !== encodeURIComponent(j.path)) history.pushState(null, "", "#" + encodeURIComponent(j.path));
    $("#q").value = ""; render(); crumbs();
  } catch (e) {}
}
window.addEventListener("popstate", () => openDir(decodeURIComponent(location.hash.slice(1)) || "/"));
function crumbs() {
  const nav = $("#crumbs"); nav.textContent = "";
  const parts = state.path.split("/").filter(Boolean); let acc = "";
  const add = (label, p, cur) => { const b = el("button", "chip" + (cur ? " cur" : ""), label); b.onclick = () => openDir(p); nav.appendChild(b); };
  add("Stockage interne", "/", parts.length === 0);
  parts.forEach((p, i) => { nav.appendChild(el("span", "sep", "›")); acc += "/" + p; add(p, acc, i === parts.length - 1); });
  $("#dropDest").textContent = "vers " + (parts[parts.length - 1] || "Stockage interne");
}
function tone(type) {
  const d = ICONS[type] || ICONS.OTHER;
  if (typeof d[1] === "string") return [d[0], "var(" + d[1] + ")", "var(" + d[2] + ")"];
  if (d[1] == null) return [d[0], "var(--container-highest)", "var(--on-surface-variant)"];
  const dark = matchMedia("(prefers-color-scheme: dark)").matches, h = (216 + d[1] + 360) % 360;
  return [d[0], `hsl(${h} 55% ${dark ? 30 : 88}%)`, `hsl(${h} 50% ${dark ? 85 : 30}%)`];
}
function render() {
  const box = $("#files"); box.textContent = ""; box.className = state.grid ? "grid" : "list";
  $("#viewBtn").classList.toggle("on", state.grid); $("#hiddenBtn").classList.toggle("on", state.hidden);
  const term = $("#q").value.trim().toLowerCase();
  const list = state.entries.filter(e => (state.hidden || !e.hidden) && (!term || e.name.toLowerCase().includes(term)));
  if (!list.length) { box.appendChild(el("div", "empty", term ? "Aucun résultat" : "Dossier vide — glissez des fichiers ici pour les envoyer")); return; }
  list.forEach((e, i) => {
    const row = el("div", "row"); row.style.animationDelay = Math.min(i, 16) * 18 + "ms";
    const [ic, bg, fg] = tone(e.type);
    const ico = el("div", "ico" + (e.dir ? " dir" : "")); ico.style.background = bg; ico.style.color = fg; ico.appendChild(icon(ic));
    if (THUMB.has(e.type) && i < 400) { const img = new Image(); img.loading = "lazy"; img.alt = ""; img.onload = () => { ico.textContent = ""; ico.appendChild(img); }; img.src = "/api/thumb?path=" + q(e.path); }
    const name = el("div", "name"); name.appendChild(el("b", null, e.name));
    name.appendChild(el("small", null, e.dir ? "Dossier" : size(e.size) + " · " + date(e.mtime)));
    row.append(ico, name);
    if (!e.dir) { const dl = el("button", "icon-btn dl"); dl.title = "Télécharger"; dl.appendChild(icon("i-download")); dl.onclick = ev => { ev.stopPropagation(); download(e.path); }; row.appendChild(dl); }
    row.onclick = () => e.dir ? openDir(e.path) : download(e.path);
    box.appendChild(row);
  });
}
function download(path) { const a = document.createElement("a"); a.href = "/api/download?path=" + q(path); a.download = ""; document.body.appendChild(a); a.click(); a.remove(); }
$("#q").addEventListener("input", render);
$("#viewBtn").onclick = () => { state.grid = !state.grid; try { localStorage.setItem("grid", state.grid ? "1" : "0"); } catch (e) {} render(); };
$("#hiddenBtn").onclick = () => { state.hidden = !state.hidden; render(); };
$("#zipBtn").onclick = () => download(state.path);

/* ---------- mkdir ---------- */
$("#mkdirBtn").onclick = () => { $("#mkdirName").value = ""; $("#mkdirDlg").showModal(); };
$("#mkdirCancel").onclick = () => $("#mkdirDlg").close();
$("#mkdirForm").addEventListener("submit", async e => {
  const name = $("#mkdirName").value.trim(); if (!name) return;
  try {
    const r = await api("/api/mkdir?path=" + q(state.path) + "&name=" + q(name), { method: "POST" });
    if (r.status === 409) toast("Ce dossier existe déjà"); else if (!r.ok) toast("Création impossible"); else { toast("Dossier créé"); openDir(state.path); }
  } catch (err) {}
});

/* ---------- upload ---------- */
$("#fab").onclick = () => $("#picker").click();
$("#picker").onchange = e => { upload([...e.target.files]); e.target.value = ""; };
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
window.addEventListener("dragenter", e => { if (!hasFiles(e) || $("#app").classList.contains("hidden")) return; e.preventDefault(); dragDepth++; $("#drop").classList.add("on"); });
window.addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener("dragleave", e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $("#drop").classList.remove("on"); } });
window.addEventListener("drop", e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; $("#drop").classList.remove("on"); upload([...e.dataTransfer.files]); });

function upload(files) {
  if (!files.length) return;
  const panel = $("#uploads"); panel.classList.remove("hidden");
  const dest = state.path; let pending = files.length;
  // One request per file: per-file progress and no giant multipart body.
  const queue = files.slice(); let active = 0;
  const next = () => {
    while (active < 3 && queue.length) {
      const f = queue.shift(); active++;
      const item = el("div", "up"); item.appendChild(el("b", null, f.name));
      const info = el("small", "muted", "0 % · " + size(f.size)); const bar = el("div", "bar"); const fill = el("i"); bar.appendChild(fill);
      item.append(info, bar); panel.prepend(item);
      const xhr = new XMLHttpRequest(); const fd = new FormData(); fd.append("file", f, f.name);
      xhr.open("POST", "/api/upload?path=" + q(dest)); xhr.withCredentials = true;
      xhr.upload.onprogress = ev => { if (ev.lengthComputable) { const p = Math.round(ev.loaded * 100 / ev.total); fill.style.width = p + "%"; info.textContent = p + " % · " + size(f.size); } };
      xhr.onloadend = () => {
        active--; pending--;
        const ok = xhr.status === 200; item.classList.add(ok ? "done" : "fail"); fill.style.width = "100%";
        info.textContent = ok ? "Envoyé · " + size(f.size) : xhr.status === 507 ? "Espace insuffisant" : xhr.status === 401 ? "Session expirée" : "Échec";
        if (xhr.status === 401) showLogin("auth");
        if (pending === 0) { toast(files.length > 1 ? files.length + " fichiers envoyés" : "Fichier envoyé"); if (state.path === dest) openDir(dest); setTimeout(() => { if (!active) { panel.classList.add("hidden"); panel.textContent = ""; } }, 5000); }
        next();
      };
      xhr.send(fd);
    }
  };
  next();
}

/* ---------- boot ---------- */
(async () => {
  const err = new URLSearchParams(location.search).get("e");
  const r = await fetch("/api/session", { credentials: "same-origin" }).catch(() => null);
  if (r && r.ok) start(); else showLogin(err);
  if (err) history.replaceState(null, "", "/");
})();
</script>
</body>
</html>
